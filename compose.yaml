services:
  catalog-service:
    build:
      context: ./services/catalog-service
      dockerfile: Containerfile
    ports:
    - "127.0.0.1:8001:8000"
  
  listing-service:
    build:
        context: ./services/listing-service
        dockerfile: Containerfile
    environment:
      CATALOG_SERVICE_URL: http://catalog-service:8000
      HTTP_TIMEOUT_SECONDS: "5.0"  # Invalid value to demonstrate validation
    ports:
      - "127.0.0.1:8002:8000"